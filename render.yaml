services:
  - type: web
    name: tunemavens-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python -m uvicorn server:app --app-dir backend --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENV
        value: production
      # Prefer split MONGO_* vars on Render to avoid UI paste-truncation of long MONGO_URL strings
      - key: MONGO_USER
        sync: false
      - key: MONGO_PASSWORD
        sync: false
      - key: MONGO_HOST
        sync: false
      - key: MONGO_SCHEME
        value: mongodb+srv
      - key: MONGO_OPTIONS
        value: retryWrites=true&w=majority
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: intermaven
      - key: CORS_ORIGINS
        value: "https://tunemavens.com,https://www.tunemavens.com,https://tunestream.co,https://www.tunestream.co,https://syncmavens.com,https://www.syncmavens.com,https://intermaven.io,https://www.intermaven.io"
      - key: JWT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: "TuneMavens <hello@contact.tunemavens.com>"
      - key: WHATSAPP_API_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        value: "1487430954445292"
      - key: WHATSAPP_VERIFY_TOKEN
        value: "tunemavens_whatsapp_verify_token_2026"

  - type: static
    name: tunestream
    buildCommand: "npm run build:tunestream"
    staticPublishPath: "apps/tunestream/dist"
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://api.tunemavens.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: static
    name: tunemavens-portal
    buildCommand: "npm run build:portal"
    staticPublishPath: "apps/portal/dist"
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://api.tunemavens.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: static
    name: syncmavens
    buildCommand: "npm run build:syncmavens"
    staticPublishPath: "apps/syncmavens/dist"
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://api.tunemavens.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

