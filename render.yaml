services:
  - type: web
    name: tunemavens-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python -m uvicorn server:app --app-dir backend --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENV
        value: production
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: intermaven
      - key: JWT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: "TuneMavens <hello@contact.tunemavens.com>"
      - key: WHATSAPP_API_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        value: "1487430954445292"
      - key: WHATSAPP_VERIFY_TOKEN
        value: "tunemavens_whatsapp_verify_token_2026"
