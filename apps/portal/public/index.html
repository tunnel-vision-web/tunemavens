    <script>
      // Unregister service worker in local development to avoid stale cached HTML pages
      if ('serviceWorker' in navigator && (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].unregister();
          }
        }).catch(function() {});
      }

      // Automatically route path-based navigation to HashRouter routes
      (function() {
        var p = window.location.pathname;
        if (!window.location.hash && p !== '/' && p !== '/index.html') {
          if (p.startsWith('/dashboard')) {
            window.location.replace('/#' + p + window.location.search);
          } else if (p.startsWith('/for/dj') || p.startsWith('/for-djs')) {
            window.location.replace('/#/dashboard?role=dj');
          } else if (p.startsWith('/for/creator') || p.startsWith('/for-creators')) {
            window.location.replace('/#/dashboard?role=creator');
          } else if (p.startsWith('/for/label') || p.startsWith('/for-labels')) {
            window.location.replace('/#/dashboard?role=label');
          }
        }
      })();
    </script>
