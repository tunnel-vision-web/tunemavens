name: Continuous Integration & Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Clean Install & Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies from backend/requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify backend imports cleanly
        run: |
          python -c "import sys; sys.path.insert(0, 'backend'); import server; print('✔ Backend server imported cleanly')"

      - name: Run payment and credit integrity suite (Spec §5.1)
        run: |
          python backend/tests/test_payment_integrity.py

      - name: Run landing page registry suite (Spec §3)
        run: |
          python backend/tests/test_landing_page_registry.py

      - name: Run SEO and crawlability suite (Spec §2)
        run: |
          python backend/tests/test_seo_rendering.py

      - name: Run shared identity and TuneStream suite (Spec §4)
        run: |
          python backend/tests/test_shared_identity_tunestream.py

      - name: Run rights data model & confidentiality suite (Spec §6 & §7)
        run: |
          python backend/tests/test_rights_and_confidentiality.py

      - name: Run beta pricing suspension and complimentary credits suite
        run: |
          python backend/tests/test_beta_pricing.py

  frontend-build:
    name: Frontend Monorepo Build & Prerender Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Run prerender verification
        run: node scripts/prerender.js

      - name: Build workspaces
        run: npm run build
