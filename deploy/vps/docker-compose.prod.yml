services:
  mongo:
    image: mongo:7
    container_name: intermaven_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ${DB_NAME:-intermaven_prod}
    networks:
      - intermaven_net

  backend:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile.backend
    container_name: intermaven_backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      HOST: 0.0.0.0
      PORT: 8001
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017}
      DB_NAME: ${DB_NAME:-intermaven_prod}
    depends_on:
      - mongo
    ports:
      - "127.0.0.1:8001:8001"
    networks:
      - intermaven_net

  api:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile.api
    container_name: intermaven_express_api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      PORT: 5000
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - intermaven_net

  nginx:
    image: nginx:1.27-alpine
    container_name: intermaven_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/intermaven.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../apps/portal/dist:/var/www/tunemavens:ro
      - ../../apps/tunestream/dist:/var/www/tunestream:ro
      - ../../apps/syncmavens/dist:/var/www/syncmavens:ro
      - ${INTERMAVEN_DIST_PATH:-../../apps/portal/dist}:/var/www/intermaven:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
      - api
    networks:
      - intermaven_net

volumes:
  mongo_data:

networks:
  intermaven_net:
    driver: bridge
