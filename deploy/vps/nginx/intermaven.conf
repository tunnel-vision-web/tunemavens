# Intermaven Ecosystem Multi-Domain Nginx Reverse Proxy
# Domains: intermaven.io, tunemavens.com, tunestream.co, syncmavens.com

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 1. Intermaven Flagship Hub (intermaven.io)
server {
    listen 80;
    server_name intermaven.io www.intermaven.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /var/www/intermaven;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /admin {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

