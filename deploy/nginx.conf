# Intermaven Network — Production Nginx Multi-Domain Configuration
# Targets Hostinger VPS / Linux Production Deployment
# Handles SSL, WebSocket Proxying, Gzip Compression, and Cross-Subdomain Auth Cookies

user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging Settings
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Performance & Optimization
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M; # Accommodates lossless audio stem uploads

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # SSL Global Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Upstream Definitions for Local Services
    upstream backend_fastapi {
        server 127.0.0.1:8001;
        keepalive 32;
    }

    upstream portal_frontend {
        server 127.0.0.1:3000;
    }

    upstream tunestream_frontend {
        server 127.0.0.1:3001;
    }

    upstream syncmavens_frontend {
        server 127.0.0.1:3002;
    }

    # 1. API GATEWAY & CORE BACKEND (api.intermaven.io / api.tunemavens.com)
    server {
        listen 80;
        listen 443 ssl http2;
        server_name api.intermaven.io api.tunemavens.com;

        ssl_certificate /etc/letsencrypt/live/api.intermaven.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.intermaven.io/privkey.pem;

        location / {
            proxy_pass http://backend_fastapi;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        location /health {
            proxy_pass http://backend_fastapi/health;
            access_log off;
        }

        location /ping {
            proxy_pass http://backend_fastapi/ping;
            access_log off;
        }
    }

    # 2. INTERMAVEN MOTHER PORTAL (intermaven.io)
    server {
        listen 80;
        listen 443 ssl http2;
        server_name intermaven.io www.intermaven.io;

        ssl_certificate /etc/letsencrypt/live/intermaven.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/intermaven.io/privkey.pem;

        location / {
            proxy_pass http://portal_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://backend_fastapi/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 3. TUNEMAVENS MARKETPLACE (tunemavens.com & Creator Web Worlds /epk/*)
    server {
        listen 80;
        listen 443 ssl http2;
        server_name tunemavens.com www.tunemavens.com *.tunemavens.com;

        ssl_certificate /etc/letsencrypt/live/tunemavens.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tunemavens.com/privkey.pem;

        location / {
            proxy_pass http://portal_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://backend_fastapi/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /sitemap.xml {
            proxy_pass http://backend_fastapi/sitemap.xml;
        }

        location /robots.txt {
            proxy_pass http://backend_fastapi/robots.txt;
        }
    }

    # 4. TUNESTREAM AUDIO STREAMING (tunestream.co)
    server {
        listen 80;
        listen 443 ssl http2;
        server_name tunestream.co www.tunestream.co;

        ssl_certificate /etc/letsencrypt/live/tunestream.co/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tunestream.co/privkey.pem;

        location / {
            proxy_pass http://tunestream_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://backend_fastapi/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 5. SYNCMAVENS SYNC MARKETPLACE (syncmavens.com)
    server {
        listen 80;
        listen 443 ssl http2;
        server_name syncmavens.com www.syncmavens.com;

        ssl_certificate /etc/letsencrypt/live/syncmavens.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/syncmavens.com/privkey.pem;

        location / {
            proxy_pass http://syncmavens_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://backend_fastapi/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
